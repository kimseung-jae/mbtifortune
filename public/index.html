<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fortune — MBTI x 혈액형 x 사주 종합운세</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>오늘의 종합운세</h1>
      <p class="sub">생년월일 · MBTI · 혈액형으로 보는 재미 운세 · 로그인 없이 무료</p>
    </header>

    <section id="form-view" class="card">
      <div class="field">
        <label>태어난 날짜</label>
        <div class="row">
          <select id="calendar">
            <option value="solar">양력</option>
            <option value="lunar">음력</option>
          </select>
          <input id="year" type="number" placeholder="년(YYYY)" min="1900" max="2100">
          <input id="month" type="number" placeholder="월" min="1" max="12">
          <input id="day" type="number" placeholder="일" min="1" max="31">
        </div>
      </div>

      <div class="field">
        <label>태어난 시간 (모르면 비워두세요)</label>
        <input id="hour" type="number" placeholder="시(0~23), 모르면 비워두기" min="0" max="23">
      </div>

      <div class="field">
        <label>MBTI</label>
        <select id="mbti">
          <option value="">선택하세요</option>
          <option>ISTJ</option><option>ISFJ</option><option>INFJ</option><option>INTJ</option>
          <option>ISTP</option><option>ISFP</option><option>INFP</option><option>INTP</option>
          <option>ESTP</option><option>ESFP</option><option>ENFP</option><option>ENTP</option>
          <option>ESTJ</option><option>ESFJ</option><option>ENFJ</option><option>ENTJ</option>
        </select>
      </div>

      <div class="field">
        <label>혈액형</label>
        <select id="bloodType">
          <option value="">선택하세요</option>
          <option value="A">A형</option>
          <option value="B">B형</option>
          <option value="O">O형</option>
          <option value="AB">AB형</option>
        </select>
      </div>

      <button id="submit-btn" class="primary-btn">종합운세 보기</button>
      <p id="error-msg" class="error"></p>
    </section>

    <section id="result-view" class="card hidden">
      <div class="result-header">
        <span id="result-date" class="badge"></span>
        <h2 id="result-element"></h2>
        <p id="result-mbti" class="sub"></p>
      </div>

      <div class="domain-list" id="domain-list"></div>

      <div class="lucky-box" id="lucky-box"></div>

      <p id="disclaimer" class="disclaimer"></p>

      <div class="actions">
        <button id="share-btn" class="primary-btn">공유 카드 만들기</button>
        <button id="back-btn" class="ghost-btn">다시 보기</button>
      </div>

      <img id="card-preview" class="card-preview hidden" alt="운세 공유 카드">
    </section>

    <section id="history-view" class="card history-card">
      <h3 class="history-title">내 운세 기록</h3>
      <p id="history-empty" class="history-empty">아직 기록이 없어요. 운세를 뽑으면 여기에 쌓여요.</p>
      <table id="history-table" class="history-table hidden">
        <thead>
          <tr>
            <th>뽑은 시각</th>
            <th>뽑은 운세</th>
          </tr>
        </thead>
        <tbody id="history-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
